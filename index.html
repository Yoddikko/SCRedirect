<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SCRedirect - Redirect automatico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d1117;
      color: #f0f6fc;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <p>⏳ Recupero link aggiornato…</p>
    <p id="status"></p>
  </div>

  <script>
    const telegraphUrl = "https://telegra.ph/Link-Aggiornato-StreamingCommunity-09-29";
    const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(telegraphUrl);

    fetch(proxyUrl)
      .then(response => {
        if (!response.ok) throw new Error("Errore nella risposta del proxy");
        return response.json();
      })
      .then(data => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, "text/html");

        // 1️⃣ Cerca il primo link HTTP/HTTPS valido
        const anchorLinks = Array.from(doc.querySelectorAll("a[href]"));
        let link = anchorLinks
          .map((a) => a.getAttribute("href") || "")
          .find((href) => href.startsWith("http://") || href.startsWith("https://"));

        // Normalizza e valida il link estratto
        const normalizeLink = (candidate) => {
          const trimmed = (candidate || "").trim();
          try {
            return new URL(trimmed).href;
          } catch (e) {
            return null;
          }
        };

        link = normalizeLink(link);

        // 2️⃣ Se non lo trova, cerca un URL nel testo
        if (!link) {
          const bodyText = doc.body.innerText;
          const urlRegex = /(https?:\/\/[^\s"'>]+)/i;
          const match = bodyText.match(urlRegex);
          if (match && match.length > 0) {
            link = normalizeLink(match[0]);
          }
        }

        // 3️⃣ Redirect o errore
        if (link) {
          document.getElementById("status").innerText = "🔁 Reindirizzamento in corso...";
          window.location.href = link;
        } else {
          document.getElementById("status").innerText = "❌ Nessun link trovato nella pagina.";
        }
      })
      .catch(error => {
        console.error("Errore:", error);
        document.getElementById("status").innerText = "⚠️ Errore nel recupero della pagina.";
      });
  </script>
</body>
</html>
