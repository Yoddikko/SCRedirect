<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>SCRedirect - Redirect automatico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d1117;
      color: #f0f6fc;
      text-align: center;
    }
    a {
      color: #58a6ff;
    }
    .manual-link {
      margin-top: 12px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div>
    <p>⏳ Recupero link aggiornato…</p>
    <p id="status"></p>
    <p id="manual-link" class="manual-link" hidden></p>
  </div>

  <script>
    const telegraphUrl = "https://telegra.ph/Link-Aggiornato-StreamingCommunity-09-29";
    const statusEl = document.getElementById("status");
    const manualLinkEl = document.getElementById("manual-link");
    const blockedHosts = new Set(["telegra.ph", "telegram.org", "t.me", "edit.telegra.ph"]);
    const urlRegex = /https?:\/\/[^\s<>"']+/g;

    const sources = [
      {
        name: "allorigins",
        fetchText: async () => {
          const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(telegraphUrl);
          const response = await fetchWithTimeout(proxyUrl, {}, 10000);
          if (!response.ok) throw new Error("Errore nella risposta di allorigins");
          const data = await response.json();
          return data.contents || "";
        },
      },
      {
        name: "jina",
        fetchText: async () => {
          const jinaUrl = "https://r.jina.ai/http://" + telegraphUrl.replace(/^https?:\/\//, "");
          const response = await fetchWithTimeout(jinaUrl, {}, 10000);
          if (!response.ok) throw new Error("Errore nella risposta di jina");
          return response.text();
        },
      },
    ];

    function showManualLink() {
      manualLinkEl.innerHTML = `Se vuoi verificare manualmente: <a href="${telegraphUrl}" target="_blank" rel="noopener">${telegraphUrl}</a>`;
      manualLinkEl.hidden = false;
    }

    function normalizeUrl(raw, baseUrl) {
      if (!raw) return null;
      const cleaned = raw.trim().replace(/[)\],.;!?]+$/, "");
      try {
        return new URL(cleaned, baseUrl).toString();
      } catch {
        return null;
      }
    }

    function isAllowedUrl(url) {
      try {
        const parsed = new URL(url);
        if (!["http:", "https:"].includes(parsed.protocol)) return false;
        if (blockedHosts.has(parsed.hostname)) return false;
        return true;
      } catch {
        return false;
      }
    }

    function extractLinkFromText(text) {
      if (!text) return null;
      const matches = text.match(urlRegex) || [];
      for (const match of matches) {
        const normalized = normalizeUrl(match, telegraphUrl);
        if (normalized && isAllowedUrl(normalized)) return normalized;
      }
      return null;
    }

    function extractLinkFromHtml(html) {
      if (!html) return null;
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      const article = doc.querySelector(".tl_article_content") || doc.querySelector("article") || doc.body;
      const anchors = article ? Array.from(article.querySelectorAll("a[href]")) : [];
      for (const anchor of anchors) {
        const href = normalizeUrl(anchor.getAttribute("href"), telegraphUrl);
        if (href && isAllowedUrl(href)) return href;
      }

      const ogDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute("content") || "";
      const twDesc = doc.querySelector('meta[name="twitter:description"]')?.getAttribute("content") || "";
      const metaLink = extractLinkFromText(`${ogDesc}\n${twDesc}`);
      if (metaLink) return metaLink;

      const bodyText = article?.innerText || doc.body?.innerText || "";
      return extractLinkFromText(bodyText);
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timeout);
      }
    }

    async function findLatestLink() {
      for (const source of sources) {
        try {
          statusEl.innerText = `🔎 Tentativo tramite ${source.name}...`;
          const text = await source.fetchText();
          const link = source.name === "allorigins"
            ? extractLinkFromHtml(text)
            : extractLinkFromText(text);
          if (link) return { link, source: source.name };
        } catch (error) {
          console.warn(`Errore ${source.name}:`, error);
        }
      }
      return null;
    }

    findLatestLink()
      .then(result => {
        if (result?.link) {
          statusEl.innerText = "🔁 Reindirizzamento in corso...";
          window.location.replace(result.link);
        } else {
          statusEl.innerText = "❌ Nessun link trovato nella pagina.";
          showManualLink();
        }
      })
      .catch(error => {
        console.error("Errore:", error);
        statusEl.innerText = "⚠️ Errore nel recupero della pagina.";
        showManualLink();
      });
  </script>
</body>
</html>
